# Do not remove/change, this redirects epicgames xmpp to lawinserver xmpp
[OnlineSubsystemMcp.Xmpp]
bUseSSL=false
ServerAddr="ws://26.108.63.150"
ServerPort=80

# Do not remove/change, this redirects epicgames xmpp to lawinserver xmpp
[OnlineSubsystemMcp.Xmpp Prod]
bUseSSL=false
ServerAddr="ws://26.108.63.150"
ServerPort=80

# Forces fortnite to use the v1 party system to support lawinserver xmpp
[OnlineSubsystemMcp]
bUsePartySystemV2=false

# Forces fortnite to use the v1 party system to support lawinserver xmpp
[OnlineSubsystemMcp.OnlinePartySystemMcpAdapter]
bUsePartySystemV2=false

# Fix for XMPP not working on some versions
[XMPP]
bEnableWebsockets=true

# Enable the OnlineSubsystem voice interface. Some builds bridge the party
# member speaking indicator through IOnlineVoice rather than straight from
# Vivox; the startup log shows it disabled ("Voice interface disabled by config
# [OnlineSubsystem].bHasVoiceEnabled"). Turn it on so talker state can reach UI.
[OnlineSubsystem]
bHasVoiceEnabled=true

# Verbose Vivox logging to debug the conference roster / speaking indicator.
[Core.Log]
LogVivoxVoiceChat=VeryVerbose
LogVoice=Verbose
LogOnlineVoice=Verbose

# Vivox voice chat. FVivox::Connect reads ServerUrl + Domain from here.
# The SDK POSTs to {ServerUrl}/api2/viv_*.php (handled by structure/vivox.js).
# Domain must match REALM in structure/vivox.js.
# NOTE: point ServerUrl at wherever the main LawinServer HTTP (the /api2
# routes) is reachable by BOTH PCs. Adjust host/port if the server log
# does not show /api2/viv_get_prelogin.php after a voice attempt.
[Vivox]
ServerUrl="http://26.108.63.150:3551"
Domain="viv.local"

# Fix for long waiting at checking connections to datacenters on Switch & Mobile
[/Script/Qos.QosRegionManager]
NumTestsPerRegion=1
PingTimeout=0.1

[/Script/Qos.QosRegionManager]
NumTestsPerRegion=1
PingTimeout=0.1
!RegionDefinitions=ClearArray
+RegionDefinitions=(DisplayName=NSLOCTEXT("MMRegion", "NAE", "NAE"), RegionId="NAE", bEnabled=true, bVisible=true, bAutoAssignable=true)
+RegionDefinitions=(DisplayName=NSLOCTEXT("MMRegion", "EU", "EU"), RegionId="EU", bEnabled=true, bVisible=true, bAutoAssignable=true)
!DatacenterDefinitions=ClearArray
+DatacenterDefinitions=(Id="NAE", RegionId="NAE", bEnabled=true, Servers[0]=(Address="ping-nae.ds.on.epicgames.com", Port=22222))
+DatacenterDefinitions=(Id="EU", RegionId="EU", bEnabled=true, Servers[0]=(Address="ping-eu.ds.on.epicgames.com", Port=22222))

[OnlineSubsystemMcp.GameServiceMcp Developer]
Protocol="http"
+ServicePermissions="Name=DedicatedServer Id=ec684b8c687f479fadea3cb2ad83f5c6 Key="

[OnlineSubsystemMcp.GameServiceMcp Localhost]
Protocol="http"
+ServicePermissions="Name=DedicatedServer Id=ec684b8c687f479fadea3cb2ad83f5c6 Key="

[OnlineSubsystemMcp.GameServiceMcp Fortnite]
!AltDomains=ClearArray
+AltDomains="fortnite-public-service-prod.ak.epicgames.com"
+ServicePermissions="Name=DedicatedServer Id=ec684b8c687f479fadea3cb2ad83f5c6 Key="


# Sidecar DSS (creative island saves), handled by structure/dss.js
[OnlineSubsystemMcp.OnlineSidecarServiceMcp]
Protocol="http"
Domain="26.108.63.150:3551"
+ServicePermissions="Name=DedicatedServer Id=ec684b8c687f479fadea3cb2ad83f5c6 Key="


[OnlineSubsystemMcp.GameServiceMcp]
bUpdatesConnectionStatus=true
+ServicePermissions="Name=DedicatedServer Id=ec684b8c687f479fadea3cb2ad83f5c6 Key="
